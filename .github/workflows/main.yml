name: Checks
on: [push, pull_request]

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          # the Cypress binary is only needed by the e2e job, which installs it itself
          CYPRESS_INSTALL_BINARY: 0
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Cloud Functions tests
        working-directory: functions
        run: |
          yarn install --frozen-lockfile
          yarn test

  e2e:
    name: Cypress smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: cypress-io/github-action@v6
        with:
          build: yarn build
          start: npx serve -s build -l 3000
          wait-on: http://localhost:3000
          wait-on-timeout: 120
          browser: chrome
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          # Set these two repository secrets to run the signed-in test; without them it is skipped.
          CYPRESS_TEST_EMAIL: ${{ secrets.CYPRESS_TEST_EMAIL }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.CYPRESS_TEST_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
